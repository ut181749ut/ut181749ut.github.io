name: 一言日記 Android アプリをビルド

# 手動で実行する。実行するたびに versionCode が1つ増えるので、
# Google Play に同じ番号で拒否されることがない。
#
# できるもの:
#   - お試し用 APK（スマホに直接入れて試す用。署名鍵がなくても作れる）
#   - Google Play 用 AAB（署名鍵のシークレットを登録したときだけ作る）
on:
  workflow_dispatch:
    inputs:
      versionName:
        description: "表示用のバージョン(例 1.0.0)"
        required: true
        default: "1.0.0"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v5

      - name: Node.js を用意
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Java を用意
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # GitHub のサーバーには Android SDK が最初から入っている
      # （android-actions/setup-android は sdkmanager の変更で動かなくなったので使わない）
      - name: Android SDK を確認
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      # www/ はWeb版（hitokoto/）をそのまま使う
      - name: Capacitor の作業フォルダを用意
        run: |
          mkdir -p build-app/www
          cp -r hitokoto/. build-app/www/
          rm -f build-app/www/README.md
          cp -r hitokoto-app/. build-app/

      - name: 依存関係をインストール
        working-directory: build-app
        run: npm install --no-audit --no-fund

      - name: Android プロジェクトを生成
        working-directory: build-app
        run: |
          npx cap add android
          npx cap sync android

      - name: 一言日記用の設定を反映(アプリ名・アイコン・バージョン)
        working-directory: build-app
        run: node scripts/android-setup.mjs "${{ github.run_number }}" "${{ inputs.versionName }}"

      - name: お試し用 APK をビルド
        working-directory: build-app/android
        run: ./gradlew assembleDebug

      - name: お試し用 APK を受け取る
        uses: actions/upload-artifact@v4
        with:
          name: hitokoto-try-${{ inputs.versionName }}-${{ github.run_number }}
          path: build-app/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: 署名鍵を書き出す
        id: key
        working-directory: build-app
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 が未登録なので、Google Play 用の AAB は作りません（お試し用 APK だけ作りました）。"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: 署名付き AAB をビルド（Google Play 用）
        if: steps.key.outputs.ok == 'true'
        working-directory: build-app/android
        env:
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=$PWD/app/release.keystore \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: 署名鍵を消す
        if: always()
        run: rm -f build-app/android/app/release.keystore

      - name: AAB を受け取る
        if: steps.key.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: hitokoto-play-${{ inputs.versionName }}-${{ github.run_number }}
          path: build-app/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
